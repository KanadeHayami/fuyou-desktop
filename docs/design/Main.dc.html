<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>图鉴 · 宽窗口</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D;font-family:'Noto Sans SC','Microsoft YaHei UI',sans-serif;color:#EEECE7}
:root{--num:'Barlow Semi Condensed','Noto Sans SC',sans-serif}
button{font-family:inherit}
.fy-input{background:transparent;border:0;outline:none;color:#EEECE7;font-family:inherit;font-size:14px;flex-grow:1;min-width:0}
.fy-input::placeholder{color:#7A7780}
.fy-input::-webkit-search-cancel-button{display:none}
.fy-search:focus-within{border-color:rgba(238,236,231,0.45)!important;background:#202026!important}
.fy-tile{transition:filter .12s ease}
.fy-tile:hover{filter:brightness(1.12)}
.fy-seg:hover,.fy-chip:hover{color:#F2F0EB!important}
.fy-ghost:hover{background:#24242A!important;color:#F2F0EB!important}
.fy-cap:hover{background:#1E1E23!important;color:#F2F0EB!important}
.fy-close:hover{background:#C42B1C!important;color:#FFFFFF!important}
.fy-scroll::-webkit-scrollbar{width:10px}
.fy-scroll::-webkit-scrollbar-thumb{background:#2C2C33;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.fy-scroll::-webkit-scrollbar-track{background:transparent}
button:focus-visible{outline:2px solid rgba(238,236,231,0.7);outline-offset:1px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #141417; border: 1px solid rgba(255,255,255,0.09); border-radius: 10px; overflow: hidden; font-family: 'Noto Sans SC', 'Microsoft YaHei UI', sans-serif; color: #EEECE7">

<header style="height: 40px; flex-shrink: 0; display: flex; align-items: stretch; background: #0F0F12; border-bottom: 1px solid rgba(255,255,255,0.06)">
<div style="display: flex; align-items: center; gap: 9px; padding: 0 6px 0 14px">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 1.5 16.5 9 9 16.5 1.5 9Z" fill="none" stroke="#EEECE7" stroke-width="1.5"></path><path d="M9 5.75 12.25 9 9 12.25 5.75 9Z" fill="#FF9E45"></path></svg>
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.02em">福佑小助手</span>
</div>
<nav aria-label="主导航" style="display: flex; align-items: stretch; margin-left: 12px">
<button type="button" aria-current="page" style="position: relative; height: 40px; padding: 0 14px; border: 0; background: transparent; font-size: 13px; font-weight: 600; color: #F2F0EB; cursor: pointer">图鉴<span style="position: absolute; left: 14px; right: 14px; bottom: 0; height: 2px; border-radius: 2px; background: #F2F0EB"></span></button>
<button type="button" class="fy-seg" style="height: 40px; padding: 0 14px; border: 0; background: transparent; font-size: 13px; color: #A9A6AE; cursor: pointer">游戏内提示</button>
<button type="button" disabled style="height: 40px; padding: 0 14px; border: 0; background: transparent; font-size: 13px; color: #6E6B74; display: flex; align-items: center; gap: 6px; cursor: default">队友<span style="font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 4px; background: #1C1C21; color: #86838C">规划中</span></button>
</nav>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; padding-right: 10px">
<button type="button" class="fy-ghost" aria-pressed="true" style="height: 28px; padding: 0 10px; border: 0; border-radius: 6px; background: #1E1E23; color: #EEECE7; display: flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M9.5 1.75 14.25 6.5 11.5 7.75 8.75 10.5 8.25 13.25 2.75 7.75 5.5 7.25 8.25 4.5Z"></path><path d="M5.25 10.75 1.75 14.25"></path></svg>置顶</button>
</div>
<button type="button" class="fy-cap" aria-label="最小化" style="width: 46px; border: 0; background: transparent; color: #A9A6AE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" stroke="currentColor" stroke-width="1"></path></svg></button>
<button type="button" class="fy-cap" aria-label="最大化" style="width: 46px; border: 0; background: transparent; color: #A9A6AE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"></rect></svg></button>
<button type="button" class="fy-close" aria-label="关闭" style="width: 46px; border: 0; background: transparent; color: #A9A6AE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1"></path></svg></button>
</header>

<div style="flex-grow: 1; min-height: 0; display: flex">

<main style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px">
<label class="fy-search" style="flex-grow: 1; min-width: 0; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; background: #1C1C21; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #86838C; cursor: text">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.75"></circle><path d="M10.5 10.5 14 14"></path></svg>
<input class="fy-input" type="search" aria-label="搜索福佑" placeholder="搜索名称、效果或拼音首字母，如 吸血 / yzcyj" value="{{text}}" onChange="{{onText}}">
<kbd style="font-family: var(--num); font-size: 11.5px; line-height: 18px; color: #86838C; border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; white-space: nowrap">Ctrl K</kbd>
</label>
<div role="group" aria-label="品质" style="display: flex; gap: 2px; padding: 3px; background: #1A1A1F; border: 1px solid rgba(255,255,255,0.07); border-radius: 9px">
<sc-for list="{{qSeg}}" as="o" hint-placeholder-count="4">
<button type="button" class="fy-seg" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; background: {{o.bg}}; color: {{o.c}}; font-weight: {{o.w}}"><sc-if value="{{o.hasDot}}" hint-placeholder-val="{{true}}"><span style="width: 7px; height: 7px; border-radius: 1.5px; transform: rotate(45deg); background: {{o.dot}}"></span></sc-if>{{o.label}}</button>
</sc-for>
</div>
<div role="group" aria-label="范围" style="display: flex; gap: 2px; padding: 3px; background: #1A1A1F; border: 1px solid rgba(255,255,255,0.07); border-radius: 9px">
<sc-for list="{{scopeSeg}}" as="o" hint-placeholder-count="3">
<button type="button" class="fy-seg" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 32px; padding: 0 12px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; background: {{o.bg}}; color: {{o.c}}; font-weight: {{o.w}}">{{o.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; font-size: 12.5px">
<span style="color: #A9A6AE"><span style="font-family: var(--num); font-size: 15px; font-weight: 600; color: #EEECE7">{{count}}</span> 条结果</span>
<span style="color: #6E6B74">示例数据 · 共 636 条</span>
<span style="width: 1px; height: 14px; background: rgba(255,255,255,0.1); margin: 0 6px"></span>
<sc-for list="{{tagChips}}" as="t" hint-placeholder-count="3">
<button type="button" class="fy-chip" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="height: 26px; padding: 0 10px; border-radius: 13px; font-size: 12px; cursor: pointer; background: {{t.bg}}; color: {{t.c}}; border: 1px solid {{t.bd}}">{{t.label}}</button>
</sc-for>
<div style="flex-grow: 1"></div>
<button type="button" class="fy-ghost" style="height: 28px; padding: 0 8px 0 10px; border: 0; border-radius: 6px; background: transparent; color: #A9A6AE; font-size: 12.5px; display: flex; align-items: center; gap: 4px; cursor: pointer">按品质分组<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 6.5 8 10l3.5-3.5"></path></svg></button>
<div role="group" aria-label="视图" style="display: flex; gap: 2px; padding: 2px; background: #1A1A1F; border-radius: 7px">
<button type="button" aria-label="图块视图" aria-pressed="true" style="width: 28px; height: 24px; border: 0; border-radius: 5px; background: #2C2C33; color: #EEECE7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg></button>
<button type="button" class="fy-seg" aria-label="列表视图" aria-pressed="false" style="width: 28px; height: 24px; border: 0; border-radius: 5px; background: transparent; color: #86838C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"></path></svg></button>
</div>
</div>

<div style="height: 1px; background: rgba(255,255,255,0.06); margin: 0 20px"></div>

<div class="fy-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 20px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<sc-if value="{{g.show}}" hint-placeholder-val="{{true}}">
<section style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 8px">
<span style="width: 7px; height: 7px; border-radius: 1.5px; transform: rotate(45deg); background: {{g.c}}"></span>
<span style="font-size: 12.5px; font-weight: 600; color: {{g.c}}">{{g.label}}</span>
<span style="font-family: var(--num); font-size: 13px; color: #86838C">{{g.count}}</span>
<span style="flex-grow: 1; height: 1px; background: rgba(255,255,255,0.06); margin-left: 6px"></span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<button type="button" class="fy-tile" onClick="{{it.pick}}" aria-pressed="{{it.on}}" style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 0; border-radius: 10px; text-align: left; cursor: pointer; min-width: 0; color: #EEECE7; background: {{it.tileBg}}; box-shadow: {{it.tileRing}}">
<div style="position: relative; width: 56px; height: 56px; flex-shrink: 0; border-radius: 8px; overflow: hidden; background: #0E0E11">
<img src="{{it.icon}}" alt="" style="width: 56px; height: 56px; display: block; object-fit: cover">
<div style="position: absolute; inset: 0; border-radius: 8px; box-shadow: inset 0 0 0 1px {{it.ring}}, inset 0 -16px 16px -12px rgba(0,0,0,0.6)"></div>
<div style="position: absolute; top: 0; left: 0; width: 13px; height: 13px; clip-path: polygon(0 0, 100% 0, 0 100%); background: {{it.qc}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px; min-width: 0; flex-grow: 1">
<div style="display: flex; align-items: center; gap: 7px; min-width: 0">
<span style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
<sc-if value="{{it.isExcl}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-size: 11px; line-height: 18px; padding: 0 6px; border-radius: 4px; background: #2A2A31; color: #B9B6BE">专属</span></sc-if>
</div>
<div style="display: flex; align-items: baseline; gap: 6px; min-width: 0; white-space: nowrap">
<span style="font-size: 12.5px; color: #8F8C95; overflow: hidden; text-overflow: ellipsis">{{it.k0}}</span>
<span style="flex-shrink: 0; font-family: var(--num); font-size: 15px; font-weight: 600; color: #72E0B4">{{it.v0}}</span>
<sc-if value="{{it.hasMore}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-family: var(--num); font-size: 12px; line-height: 16px; padding: 0 5px; border-radius: 4px; background: #24242A; color: #A9A6AE">{{it.more}}</span></sc-if>
</div>
</div>
</button>
</sc-for>
</div>
</section>
</sc-if>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 80px 0">
<div style="font-size: 15px; font-weight: 600">没有匹配的福佑</div>
<div style="font-size: 13px; color: #86838C">换个关键词，或清除当前筛选。</div>
<button type="button" class="fy-ghost" onClick="{{reset}}" style="margin-top: 8px; height: 30px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; background: transparent; color: #EEECE7; font-size: 12.5px; cursor: pointer">清除筛选</button>
</div>
</sc-if>
</div>
</main>

<aside aria-label="福佑详情" style="width: 420px; flex-shrink: 0; display: flex; flex-direction: column; background: #18181C; border-left: 1px solid rgba(255,255,255,0.06)">
<div style="height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 16px 0 24px">
<span style="font-size: 12px; color: #86838C; letter-spacing: 0.12em">详情</span>
<div style="flex-grow: 1"></div>
<button type="button" class="fy-ghost" aria-label="复制效果文本" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #A9A6AE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="5.25" y="5.25" width="8.5" height="8.5" rx="1.75"></rect><path d="M10.75 5.25V3.75a1.5 1.5 0 0 0-1.5-1.5H3.75a1.5 1.5 0 0 0-1.5 1.5v5.5a1.5 1.5 0 0 0 1.5 1.5h1.5"></path></svg></button>
<button type="button" class="fy-ghost" aria-label="收藏" style="width: 32px; height: 32px; border: 0; border-radius: 6px; background: transparent; color: #A9A6AE; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.75 9.9 5.6l4.25.62-3.07 3 .72 4.23L8 11.45l-3.8 2 .72-4.23-3.07-3 4.25-.62Z"></path></svg></button>
</div>
<div class="fy-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 24px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; gap: 18px; align-items: center">
<div style="position: relative; width: 88px; height: 88px; flex-shrink: 0; border-radius: 12px; overflow: hidden; background: #0E0E11">
<img src="{{sel.icon}}" alt="" style="width: 88px; height: 88px; display: block; object-fit: cover">
<div style="position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 0 1px {{sel.ring}}, inset 0 -22px 22px -16px rgba(0,0,0,0.6)"></div>
<div style="position: absolute; top: 0; left: 0; width: 18px; height: 18px; clip-path: polygon(0 0, 100% 0, 0 100%); background: {{sel.qc}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
<h2 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; letter-spacing: 0.01em">{{sel.name}}</h2>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 6px; font-size: 12px; font-weight: 600; background: {{sel.qbg}}; color: {{sel.qc}}"><span style="width: 6px; height: 6px; border-radius: 1px; transform: rotate(45deg); background: {{sel.qc}}"></span>{{sel.qlabel}}</span>
<sc-for list="{{sel.meta}}" as="m" hint-placeholder-count="1"><span style="height: 24px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 6px; background: #222228; color: #B9B6BE; font-size: 12px">{{m}}</span></sc-for>
</div>
</div>
</div>
<section style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 12px; font-weight: 500; color: #86838C; letter-spacing: 0.12em">效果</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.85; color: #E4E2DC"><sc-for list="{{sel.descSeg}}" as="s" hint-placeholder-count="5"><span style="color: {{s.c}}; font-family: {{s.f}}; font-size: {{s.s}}; font-weight: {{s.w}}">{{s.t}}</span></sc-for></p>
</section>
<section style="display: flex; flex-direction: column">
<h3 style="margin: 0 0 2px; font-size: 12px; font-weight: 500; color: #86838C; letter-spacing: 0.12em">数值区间</h3>
<sc-for list="{{sel.stats}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06)">
<span style="font-size: 13.5px; color: #A9A6AE">{{r.k}}</span>
<span style="display: flex; align-items: baseline; gap: 5px; white-space: nowrap"><span style="font-family: var(--num); font-size: 19px; font-weight: 600; color: #72E0B4; font-variant-numeric: tabular-nums">{{r.v}}</span><span style="font-size: 12.5px; color: #86838C">{{r.u}}</span></span>
</div>
</sc-for>
</section>
<div style="display: flex; gap: 10px; padding: 12px 14px; border-radius: 8px; background: #1F1F24; font-size: 12.5px; line-height: 1.7; color: #A9A6AE">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><circle cx="8" cy="8" r="6.25"></circle><path d="M8 7.25v4M8 4.9v.01"></path></svg>
<span>区间为图鉴收录范围。实战收益取决于本局抽取值与英雄状态，接入游戏内提示后会显示实际数值。</span>
</div>
</div>
<div style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; border-top: 1px solid rgba(255,255,255,0.06); font-size: 12px; color: #86838C">
<span style="display: flex; align-items: center; gap: 4px"><kbd style="font-family: var(--num); font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; border-radius: 4px">↑</kbd><kbd style="font-family: var(--num); font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; border-radius: 4px">↓</kbd><span style="margin-left: 3px">切换</span></span>
<span style="display: flex; align-items: center; gap: 4px"><kbd style="font-family: var(--num); font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; border-radius: 4px">Ctrl C</kbd><span style="margin-left: 3px">复制效果</span></span>
<span style="display: flex; align-items: center; gap: 4px"><kbd style="font-family: var(--num); font-size: 11px; line-height: 16px; padding: 0 5px; border: 1px solid rgba(255,255,255,0.12); border-bottom-width: 2px; border-radius: 4px">Esc</kbd><span style="margin-left: 3px">回到搜索</span></span>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  quality() {
    return {
      o: { label: '橙色', c: '#FF9E45', bg: 'rgba(255,158,69,0.13)', ring: 'rgba(255,158,69,0.62)' },
      p: { label: '紫色', c: '#B996FF', bg: 'rgba(185,150,255,0.14)', ring: 'rgba(185,150,255,0.62)' },
      b: { label: '蓝色', c: '#66B2FF', bg: 'rgba(102,178,255,0.14)', ring: 'rgba(102,178,255,0.62)' }
    };
  }
  data() {
    const B = '/_blob/';
    return [
      { id: 'chuanyun', name: '一支穿云箭', py: 'yzcyj', q: 'o', scope: '通用', tags: [], icon: B + '2db92353b875f7561a8987ac6d13f577',
        keys: [['魔法伤害', '15–30 ×等级']],

  seg(parts) {
    return parts.map((p) => {
      if (p[1] === 'n') return { t: p[0], c: '#72E0B4', w: '600', f: 'var(--num)', s: '16.5px' };
      if (p[1] === 'm') return { t: p[0], c: '#86838C', w: '400', f: 'inherit', s: 'inherit' };
      return { t: p[0], c: '#E4E2DC', w: '400', f: 'inherit', s: 'inherit' };
    });
  }
  renderVals() {
    const st = Object.assign({ q: 'all', scope: 'all', tag: '', text: '', sel: 'chuanyun' }, this.state || {});
    const Q = this.quality();
    const all = this.data();
    const text = st.text.trim().toLowerCase();
    const hay = (d) => (d.name + ' ' + d.py + ' ' + d.keys.map((k) => k.join(' ')).join(' ') + ' ' + d.desc.map((s) => s[0]).join('')).toLowerCase();
    const list = all.filter((d) => (st.q === 'all' || d.q === st.q) && (st.scope === 'all' || d.scope === st.scope) && (!st.tag || d.tags.indexOf(st.tag) >= 0) && (!text || hay(d).indexOf(text) >= 0));
    const deco = (d) => {
      const q = Q[d.q];
      const on = d.id === st.sel;
      return {
        id: d.id, name: d.name, icon: d.icon, qc: q.c, qbg: q.bg, ring: q.ring, qlabel: q.label, on: on,
        k0: d.keys[0][0], v0: d.keys[0][1], hasMore: d.keys.length > 1, more: '+' + (d.keys.length - 1),
        isExcl: d.scope === '专属',
        tileBg: on ? '#26262D' : '#1A1A1F',
        tileRing: on ? 'inset 0 0 0 1px rgba(238,236,231,0.45)' : 'inset 0 0 0 1px rgba(255,255,255,0.05)',
        pick: () => this.setState({ sel: d.id })
      };
    };
    const groups = ['o', 'p', 'b'].map((k) => {
      const items = list.filter((d) => d.q === k).map(deco);
      return { label: Q[k].label, c: Q[k].c, count: items.length, items: items, show: items.length > 0 };
    });
    const cur = all.filter((d) => d.id === st.sel)[0] || all[0];
    const sel = deco(cur);
    sel.meta = [cur.scope].concat(cur.tags);
    sel.descSeg = this.seg(cur.desc);
    sel.stats = cur.stats.map((s) => ({ k: s[0], v: s[1], u: s[2] || '' }));
    const mk = (key, opts) => opts.map((o) => {
      const on = st[key] === o.v;
      return { label: o.label, dot: o.dot || '', hasDot: !!o.dot, on: on, bg: on ? '#2C2C33' : 'transparent', c: on ? '#F2F0EB' : '#A9A6AE', w: on ? '600' : '400', pick: () => this.setState({ [key]: o.v }) };
    });
    const tagChips = ['仅限远程', '仅限近战', '队伍唯一'].map((t) => {
      const on = st.tag === t;
      return { label: t, on: on, bg: on ? 'rgba(238,236,231,0.1)' : 'transparent', bd: on ? 'rgba(238,236,231,0.5)' : 'rgba(255,255,255,0.1)', c: on ? '#F2F0EB' : '#A9A6AE', pick: () => this.setState({ tag: on ? '' : t }) };
    });
    return {
      groups: groups, sel: sel, count: list.length, empty: list.length === 0, text: st.text,
      onText: (e) => this.setState({ text: e.target.value }),
      reset: () => this.setState({ q: 'all', scope: 'all', tag: '', text: '' }),
      qSeg: mk('q', [{ v: 'all', label: '全部' }, { v: 'o', label: '橙色', dot: Q.o.c }, { v: 'p', label: '紫色', dot: Q.p.c }, { v: 'b', label: '蓝色', dot: Q.b.c }]),
      scopeSeg: mk('scope', [{ v: 'all', label: '全部' }, { v: '通用', label: '通用' }, { v: '专属', label: '专属' }]),
      tagChips: tagChips
    };
  }
